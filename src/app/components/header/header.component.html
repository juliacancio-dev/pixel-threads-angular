<header class="site-header">
  @if (!paginaAuth()) {
    <div class="topbar">FRETE GRÁTIS ACIMA DE R$ 150 · USE O CUPOM PIXEL10 E GANHE 10% OFF</div>
  }
  <div class="container navbar" [style.justify-content]="paginaAuth() ? 'center' : null">
    <a routerLink="/" class="logo">PIXEL<span>THREADS</span></a>

    @if (!paginaAuth()) {
      <button class="nav-toggle" aria-label="Abrir menu" [attr.aria-expanded]="menuAberto" (click)="toggleMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <ul class="nav-links" [class.open]="menuAberto">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="menuAberto = false">Início</a></li>
        <li><a routerLink="/busca" [queryParams]="{categoria: 'games'}" routerLinkActive="active" (click)="menuAberto = false">Games</a></li>
        <li><a routerLink="/busca" [queryParams]="{categoria: 'filmes'}" routerLinkActive="active" (click)="menuAberto = false">Filmes &amp; Séries</a></li>
        <li><a routerLink="/busca" [queryParams]="{categoria: 'programacao'}" routerLinkActive="active" (click)="menuAberto = false">Programação</a></li>
        <li><a routerLink="/busca" (click)="menuAberto = false">Ofertas</a></li>
      </ul>

      <form class="nav-search" role="search" (submit)="$event.preventDefault(); buscar()">
        <input type="search" name="q" placeholder="Buscar camiseta, tema, franquia…" aria-label="Buscar produtos" [(ngModel)]="termoBusca">
        <button type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </form>

      <div class="nav-icons">
        <a routerLink="/login" class="icon-btn" aria-label="Entrar na conta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a>
        <a routerLink="/cesta" class="icon-btn" aria-label="Ver cesta de compras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
          <span class="badge">{{ cestaService.totalItens() }}</span>
        </a>
      </div>
    }
  </div>
</header>
